[package]
name = "elytra-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip", "http2", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "aes-crypto", "time"] }
tar = "0.4"
flate2 = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
notify = "8"
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
chacha20poly1305 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tempfile = "3"
